name: build-wda
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda

      - name: Show xcode
        run: xcodebuild -version

      - name: Build for testing (no signing)
        working-directory: wda
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -allowProvisioningUpdates NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" | tail -40

      - name: Package unsigned ipa
        run: |
          set -x
          APP=$(find wda/build -maxdepth 6 -type d -name 'WebDriverAgentRunner-Runner.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WDA.ipa Payload
          ls -la WDA.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WDA-ipa
          path: WDA.ipa
          if-no-files-found: error
