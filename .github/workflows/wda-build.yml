# 在 GitHub Actions 的 macOS 免费机器上编 WebDriverAgent，产出一个未签名 ipa
# 用法：把这个文件放到任意仓库的 .github/workflows/wda-build.yml，手动 Run workflow，跑完在 Artifacts 下载 WDA.ipa
# 拿到 ipa 后回到 Windows：用 Sideloadly 填 Apple ID 重签（免费证书 7 天有效），装进手机
# 装好之后本机就能：pymobiledevice3 developer wda --xctrunner com.facebook.WebDriverAgentRunner.xctrunner tap/swipe/type

name: build-wda
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WDA
        run: |
          git clone --depth 1 https://github.com/appium/WebDriverAgent.git wda

      - name: Build for testing (no signing)
        working-directory: wda
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned ipa
        run: |
          APP=$(find wda/build -name 'WebDriverAgentRunner-Runner.app' -maxdepth 6 | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WDA.ipa Payload
          ls -la WDA.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WDA-ipa
          path: WDA.ipa
